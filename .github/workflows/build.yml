name: Build fonts

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  variants:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [cl100k, o200k, p50k, r50k, llama4, llama3, llama2, gemma3, gemma,
                  mistral, tekken, qwen, deepseek, glm, neox, falcon, bloom, t5, bert,
                  superbpe, granite, falcon3, hunyuan, ernie, seed, yi, clip, kimi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache Plex and tokenizer downloads
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ hashFiles('scripts/fetch-plex.sh', 'fonts/tokenizer/recipe.py') }}
      - run: python -m venv .venv && .venv/bin/pip install -r requirements.txt
      - run: ./scripts/fetch-plex.sh
      - run: make smoke test
      - run: make tokenizer V=${{ matrix.variant }}
      - run: make tokcheck V=${{ matrix.variant }} | grep 'tokens font/real' | tee build/tokenizer/tokcheck-${{ matrix.variant }}.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: variant-${{ matrix.variant }}
          path: build/tokenizer/
          if-no-files-found: error

  bundle:
    name: Bundle and publish
    needs: variants
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: variant-*
          path: parts
      - name: Merge variants into build/tokenizer
        run: |
          mkdir -p build/tokenizer
          python3 - <<'PY'
          import json, pathlib, shutil
          out = pathlib.Path("build/tokenizer"); manifest = {}
          for part in sorted(pathlib.Path("parts").glob("variant-*")):
              for f in part.iterdir():
                  if f.name == "manifest.json":
                      manifest.update(json.loads(f.read_text()))
                  else:
                      shutil.copy(f, out / f.name)
          (out / "manifest.json").write_text(json.dumps(manifest, indent=2))
          print(f"{len(manifest)} variants")
          PY
      - name: Release notes with the accuracy table
        run: |
          python3 - <<'PY'
          import pathlib, re
          rows = []
          for f in sorted(pathlib.Path("build/tokenizer").glob("tokcheck-*.txt")):
              m = re.search(r"(\w+)\s+tokens font/real (\d+)/(\d+)\s+precision ([\d.]+%)\s+recall ([\d.]+%)\s+shaping (\d+) us/char\s+size ([\d.]+ MB)", f.read_text())
              if m: rows.append(m.groups())
          rows.sort(key=lambda r: -float(r[3].rstrip("%")))
          out = ["Monospace color fonts that highlight LLM tokens as you type. One style per tokenizer, "
                 f"{len(rows)} in this release, all in one family \"Tokenizer Mono\".", "",
                 "**Downloads**: `tokenizer-mono-fonts.zip` has TTF, WOFF and WOFF2 for every face plus the demo page; "
                 "`tokenizer-mono-woff2.zip` is just the WOFF2 files for the web.", "",
                 "Boundary agreement with the real tokenizer on the test corpus (see the README for how this is measured):", "",
                 "| face | precision | recall | tokens font / real | shaping | TTF |", "|---|---|---|---|---|---|"]
          out += [f"| {n} | {p} | {r} | {a} / {b} | {s} µs/char | {z} |" for n, a, b, p, r, s, z in rows]
          pathlib.Path("notes.md").write_text("\n".join(out) + "\n")
          PY
          cat notes.md
      - name: Zip (fonts + demo page, same layout as the repo)
        run: |
          rm -f build/tokenizer/tokcheck-*.txt
          zip -qr tokenizer-mono-fonts.zip build/tokenizer demo README.md
          (cd build/tokenizer && zip -q ../../tokenizer-mono-woff2.zip *.woff2 manifest.json)
          ls -la tokenizer-mono-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: tokenizer-mono-fonts
          path: |
            tokenizer-mono-fonts.zip
            tokenizer-mono-woff2.zip
      - name: Release (on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" tokenizer-mono-fonts.zip tokenizer-mono-woff2.zip --title "Tokenizer Mono ${GITHUB_REF_NAME}" --notes-file notes.md
